# Lightpath login-screen streaming: a second Sunshine that runs (as root) only while the PC shows
# the GDM login screen, so the Mac can connect and type the password. It reads the real screen
# straight from the graphics card (KMS) because there is no logged-in desktop to ask, and it
# uses the same identity and paired devices as the desktop Sunshine (copied at each start), so
# the Mac connects to it exactly like to the desktop.
sunshine_name = Lightpath PC
port = 48989
address_family = both
lan_encryption_mode = 0
wan_encryption_mode = 1
origin_web_ui_allowed = pc
upnp = disabled
dscp_tagging = enabled
fec_percentage = 20
capture = kms
encoder = nvenc
nvenc_preset = 1
nvenc_spatial_aq = disabled
hevc_mode = 0
av1_mode = 0
min_log_level = info
notify_pre_releases = disabled
system_tray = disabled
file_apps = /etc/lightpath/greeter/apps.json
file_state = /var/lib/lightpath-greeter/sunshine_state.json
credentials_file = /var/lib/lightpath-greeter/sunshine_state.json
pkey = /var/lib/lightpath-greeter/credentials/cakey.pem
cert = /var/lib/lightpath-greeter/credentials/cacert.pem
log_path = /var/lib/lightpath-greeter/sunshine.log
