# Lightpath-tuned Sunshine configuration.
# Installed to ~/.config/sunshine/sunshine.conf by host/install.sh (existing credentials are kept).

sunshine_name = Lightpath PC

# --- Network ---------------------------------------------------------------
# All ports shifted +1000 (47998/udp is used by another service on this PC):
#   48984 https, 48989 http, 48990 web UI, 48998 video, 48999 control, 49000 audio, 49010 rtsp
port = 48989
address_family = both
# Tailscale (100.64.0.0/10) counts as LAN: the tunnel is already WireGuard-encrypted.
lan_encryption_mode = 0
wan_encryption_mode = 1
origin_web_ui_allowed = lan
upnp = disabled
# Wi-Fi WMM maps DSCP to the voice/video access categories: video frames jump the AP queue.
dscp_tagging = enabled
# 20% Reed-Solomon parity per frame: survives Wi-Fi bursts without retransmission delay.
fec_percentage = 20

# --- Capture ---------------------------------------------------------------
# Lightpath's GNOME virtual display: a monitor created per stream at exactly the client's
# resolution and refresh rate (e.g. 3024x1964 @ 120 Hz on a 14" MacBook Pro).
capture = mutter
encoder = nvenc

# --- NVENC (RTX 4090: 2 encoder engines) -----------------------------------
# P1 = fastest preset; quality comes from bitrate on LAN. Split-frame encoding cuts each frame
# in two horizontal strips encoded in parallel on both NVENC engines.
nvenc_preset = 1
nvenc_twopass = quarter_res
nvenc_spatial_aq = disabled
nvenc_split_encode = enabled
hevc_mode = 0
av1_mode = 0

# --- Misc ------------------------------------------------------------------
min_log_level = info
notify_pre_releases = disabled
system_tray = disabled
